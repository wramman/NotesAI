<header
  class="sticky top-0 z-30 w-full border-b border-surface-variant/30 bg-surface/80 backdrop-blur-md dark:border-white/5 dark:bg-canvas-dark/80"
>
  <div class="mx-auto flex h-16 w-full max-w-[1200px] items-center justify-between px-6">
    <div class="flex flex-1 items-center">
      <button
        type="button"
        class="mr-4 inline-flex h-10 w-10 items-center justify-center rounded-full text-on-surface-variant transition-colors hover:bg-surface-variant/60 hover:text-primary md:hidden dark:text-outline"
        [attr.aria-expanded]="ui.menuOpen()"
        aria-label="Abrir menú"
        (click)="ui.toggleMenu()"
      >
        <span class="material-symbols-outlined">menu</span>
      </button>
      <div class="group relative hidden w-full max-w-md md:block"></div>
    </div>

    <div class="flex items-center gap-1">
      <div #colorPicker class="relative">
        <button
          type="button"
          class="inline-flex h-10 w-10 items-center justify-center rounded-full text-on-surface-variant transition-colors duration-200 hover:bg-surface-variant/60 hover:text-primary disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:bg-transparent disabled:hover:text-on-surface-variant dark:text-outline dark:hover:bg-white/10 dark:hover:text-inverse-primary dark:disabled:hover:text-outline"
          [disabled]="!ui.selected()"
          [attr.aria-expanded]="ui.colorPickerOpen()"
          title="Color de la nota"
          (click)="ui.toggleColorPicker()"
        >
          <span class="material-symbols-outlined">palette</span>
        </button>

        @if (ui.colorPickerOpen() && ui.selected()) {
          <div
            class="absolute top-full right-0 z-50 mt-2 w-52 rounded-lg border border-surface-variant/50 bg-surface-container p-3 shadow-lg dark:border-white/10 dark:bg-sidebar-dark"
          >
            <p class="font-label-md text-label-md mb-2 tracking-wider text-outline uppercase">
              Color
            </p>
            <div class="flex items-center gap-2">
              <input
                type="color"
                class="h-9 w-9 cursor-pointer rounded border border-surface-variant bg-transparent p-0 dark:border-white/10"
                [value]="ui.hexDraft()"
                (input)="onPickerColor($any($event.target).value)"
              />
              <input
                type="text"
                class="font-body-sm text-body-sm min-w-0 flex-1 rounded-md border border-surface-variant bg-surface px-2 py-1.5 text-on-surface outline-none focus:border-primary dark:border-white/10 dark:bg-canvas-dark dark:text-inverse-on-surface"
                maxlength="7"
                spellcheck="false"
                [value]="ui.hexDraft()"
                (input)="onHexInput($any($event.target).value)"
              />
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</header>
